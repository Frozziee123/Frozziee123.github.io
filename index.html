<!DOCTYPE html>
<html lang="en>"
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day Envelope</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="envelope" onclick="openEnvelope">
        <div class="flap"></div>
        <div class="body"></div>
        <div class="message">
            <h1>Happy Valentine's Day!</h1>
            <p>Enjoy your day</p>
        </div>
    </div>

    <script>
        function openEnvelope() {
            const envelope= document.querySelector('.envelope');envelope.classList.toggle('open');
        }
    </script>
</body>
</html>
